name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -o mystery-button.zip
          

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare mystery
        run: |
          mkdir -p app/src/main/res/raw
          echo 'aHR0cHM6Ly9jb21tb25zLndpa2ltZWRpYS5vcmcvd2lra2kvU3BlY2lhbDpSZWRpcmVjdC9maWxlL0FpcnBsYW5lX0NoaW1lX1NvdW5kX0VmZmVjdC5vZ2c=' | base64 -d > /tmp/source
          curl -L --fail --retry 3 -o app/src/main/res/raw/mystery.ogg "$(cat /tmp/source)"

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mystery-apk
          path: app/build/outputs/apk/debug/app-debug.apk